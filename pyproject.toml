[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdoml-task1"
version = "0.0.1"
description = "SDOML Task 1 - Scalable Data Mining with Machine Learning"
authors = [
  { name = "Amets" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "pandas",
    "datasets",
    "soundfile",
    "ipykernel",
    "seaborn>=0.13.2",
    "matplotlib>=3.11.1",
    "jupyterlab>=4.6.3",
    "torchcodec>=0.16.0",
    "ipywidgets>=8.1.9",
    "torch>=2.14.0",
    "lightning>=2.6.5",
    "librosa>=1.0.0",
    "torchvision>=0.29.0",
]

requires-python = ">=3.12"

[tool.ruff]
line-length = 99
src = ["sdoml_task1"]
include = ["pyproject.toml", "sdoml_task1/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["sdoml_task1"]
force-sort-within-sections = true

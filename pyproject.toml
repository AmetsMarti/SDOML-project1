[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdoml-task1"
version = "0.0.1"
description = "SDOML Task 1 - Scalable Data Mining with Machine Learning"
authors = [
  { name = "Amets" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "pandas",
    "datasets",
    "soundfile",
    "ipykernel",
]

requires-python = ">=3.12"

[tool.ruff]
line-length = 99
src = ["sdoml_task1"]
include = ["pyproject.toml", "sdoml_task1/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["sdoml_task1"]
force-sort-within-sections = true
